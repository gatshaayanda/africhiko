name: Africhiko Firebase rules deploy (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africhiko-firebase-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Confirm target project is explicitly configured
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          echo "Rules deployment is manually requested for the configured project."
      - name: Deploy reviewed Firestore and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
